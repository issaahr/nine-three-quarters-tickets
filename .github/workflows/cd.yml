name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install-ubuntu.sh | sh

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:login

      - name: Build and push API image
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        working-directory: apps/api
        run: heroku container:push web --app "${{ secrets.HEROKU_APP_NAME }}"

      - name: Record current API release
        id: previous_release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          version="$(heroku releases --app "${{ secrets.HEROKU_APP_NAME }}" --num 1 --json | jq -r '.[0].version')"

          if [[ ! "$version" =~ ^[0-9]+$ ]]; then
            echo "Não foi possível identificar a release atual para rollback." >&2
            exit 1
          fi

          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - name: Release API image
        env:
          HEALTH_URL: ${{ secrets.HEROKU_HEALTH_URL }}
        # As migrations executam durante a inicialização e precisam manter compatibilidade
        # com a release anterior; este rollback não reverte schema nem dados.
        run: heroku container:release web --app "${{ secrets.HEROKU_APP_NAME }}"

      - name: Validate API health
        id: health
        continue-on-error: true
        env:
          HEALTH_URL: ${{ secrets.HEROKU_HEALTH_URL }}
          HEALTH_ATTEMPTS: 12
          HEALTH_TIMEOUT_SECONDS: 10
          HEALTH_RETRY_DELAY_SECONDS: 5
        run: |
          for attempt in $(seq 1 "$HEALTH_ATTEMPTS"); do
            if response="$(curl --fail --silent --show-error --max-time "$HEALTH_TIMEOUT_SECONDS" "$HEALTH_URL")" \
              && jq -e '.ok == true' >/dev/null <<< "$response"; then
              exit 0
            fi

            if [[ "$attempt" -lt "$HEALTH_ATTEMPTS" ]]; then
              sleep "$HEALTH_RETRY_DELAY_SECONDS"
            fi
          done

          echo "A API não respondeu saudavelmente dentro do prazo configurado." >&2
          exit 1

      - name: Roll back unhealthy API release
        if: ${{ steps.health.outcome == 'failure' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku rollback "${{ steps.previous_release.outputs.version }}" --app "${{ secrets.HEROKU_APP_NAME }}"

      - name: Mark deployment as failed after rollback
        if: ${{ steps.health.outcome == 'failure' }}
        run: |
          echo "O health check falhou; a release anterior foi restaurada." >&2
          exit 1
