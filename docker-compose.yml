services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  api:
    build:
      context: ./apps/api
      target: development
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    networks:
      - app_network

  web:
    build:
      context: ./apps/web
      target: development
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    init: true
    networks:
      - app_network

volumes:
  api_node_modules:
  postgres_data:
  web_node_modules:

networks:
  app_network:
    driver: bridge
